language: rust
type: library

tasks:
  build:
    command: cargo build -p rhashup-core
    inputs:
      - 'src/**/*'
      - 'Cargo.toml'
      - '/Cargo.toml'
      - '/Cargo.lock'

  test:
    command: cargo test -p rhashup-core
    deps:
      - '~:build'
    inputs:
      - 'src/**/*'
      - 'Cargo.toml'
      - '/Cargo.toml'
      - '/Cargo.lock'
      - '/tests/fixtures/**/*'

  lint:
    command: cargo clippy -p rhashup-core -- -D warnings
    deps:
      - '~:build'
    inputs:
      - 'src/**/*'
      - 'Cargo.toml'
      - '/Cargo.toml'
      - '/Cargo.lock'
