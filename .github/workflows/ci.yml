name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (test + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p rhashup-core -- -D warnings
      - run: cargo test -p rhashup-core

  wasm:
    name: WASM Build
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - name: Install WASI SDK
        run: |
          curl -LO https://github.com/aspect-build/wasi-sdk-container/releases/download/wasi-sdk-25/wasi-sdk-25.0-x86_64-linux.tar.gz
          tar xzf wasi-sdk-25.0-x86_64-linux.tar.gz
          echo "WASI_SDK_PATH=$(pwd)/wasi-sdk-25.0-x86_64-linux" >> $GITHUB_ENV
          echo "CC_wasm32_wasip1=$(pwd)/wasi-sdk-25.0-x86_64-linux/bin/clang" >> $GITHUB_ENV
          echo "CFLAGS_wasm32_wasip1=--sysroot=$(pwd)/wasi-sdk-25.0-x86_64-linux/share/wasi-sysroot" >> $GITHUB_ENV
      - run: cargo build -p rhashup-wasm --target wasm32-wasip1 --release
      - uses: actions/upload-artifact@v4
        with:
          name: rhashup-wasm
          path: target/wasm32-wasip1/release/rhashup-wasm.wasm

  go:
    name: Go CLI
    runs-on: ubuntu-latest
    needs: wasm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/download-artifact@v4
        with:
          name: rhashup-wasm
          path: apps/cli/
      - run: mv apps/cli/rhashup-wasm.wasm apps/cli/rhashup.wasm
      - run: cd apps/cli && go vet ./...
      - run: cd apps/cli && go build -o rhashup .
