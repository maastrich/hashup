name: Docs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.meta.outputs.base }}
      dest: ${{ steps.meta.outputs.dest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Compute base path
        id: meta
        run: |
          REPO="${GITHUB_REPOSITORY##*/}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SLUG="pr-${{ github.event.pull_request.number }}"
            echo "base=/${REPO}/branches/${SLUG}/" >> "$GITHUB_OUTPUT"
            echo "dest=branches/${SLUG}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "base=/${REPO}/" >> "$GITHUB_OUTPUT"
            echo "dest=." >> "$GITHUB_OUTPUT"
          else
            SLUG="${GITHUB_REF_NAME//\//-}"
            echo "base=/${REPO}/branches/${SLUG}/" >> "$GITHUB_OUTPUT"
            echo "dest=branches/${SLUG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build docs
        run: vp exec vitepress build docs
        env:
          DOCS_BASE: ${{ steps.meta.outputs.base }}

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs/.vitepress/dist
          if-no-files-found: error

  deploy:
    name: Deploy to gh-pages
    needs: build
    runs-on: ubuntu-latest
    # Skip deploy for PRs from forks (no write access to gh-pages).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      # All deploys share one lock so parallel pushes to gh-pages don't race.
      group: docs-deploy
      cancel-in-progress: false

    steps:
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: site

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          destination_dir: ${{ needs.build.outputs.dest }}
          # Preserve previews for other branches when deploying main, and vice versa.
          keep_files: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "docs: deploy ${{ needs.build.outputs.dest }} from ${{ github.sha }}"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo.repo;
            const owner = context.repo.owner;
            const base = '${{ needs.build.outputs.base }}';
            const url = `https://${owner}.github.io${base}`;
            const marker = '<!-- docs-preview -->';
            const body = `${marker}\n📖 **Docs preview:** ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: context.issue.number,
                body,
              });
            }
